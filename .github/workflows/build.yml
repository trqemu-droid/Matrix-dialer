name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # ১. কোড চেকআউট
      - name: Checkout code
        uses: actions/checkout@v4

      # ২. জাভা ১৭ সেটআপ
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ৩. আধুনিক Gradle 8.10.2 সেটআপ (অটোমেটিক ডাউনলোড হবে)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # ৪. যদি gradlew না থাকে, আধুনিক 8.10.2 দিয়ে জেনারেট করা
      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.10.2 --distribution-type bin
          fi
          chmod +x gradlew

      # ৫. APK বিল্ড করা
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # ৬. তৈরি হওয়া APK আপলোড করা (ডাউনলোডের জন্য)
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MatrixDialer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
